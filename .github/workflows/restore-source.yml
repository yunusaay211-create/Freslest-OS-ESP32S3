name: Restore five verified font source files
on:
  push:
    branches: [main]
    paths:
      - 'tools/source_restore_manifest.json'
      - 'tools/restore_source.py'
      - '.github/workflows/restore-source.yml'
permissions:
  contents: write
jobs:
  restore:
    if: contains(github.event.head_commit.message, '[restore-fonts]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact approved dependency bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/restore_source.py
      - name: Verify firmware screen and input integration
        run: python3 tests/run_screen_input_tests.py
      - name: Commit complete source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OS/components/LovyanGFX/src/lgfx/Fonts/
          if ! git diff --cached --quiet; then
            git commit -m 'Restore five byte-verified upstream font sources'
            git push origin HEAD:main
          fi
