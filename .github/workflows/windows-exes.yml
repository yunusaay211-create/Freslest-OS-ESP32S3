name: Freslest 1.0 Windows EXEs
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'OS/**'
      - 'Doom/**'
      - 'common/**'
      - 'shared_components/**'
      - 'tools/build_lcd_profiles.py'
      - 'viewer/**'
      - 'tests/**'
      - 'firmware-payload.zip'
      - 'firmware-payload/**'
      - 'build_windows.py'
      - 'prepare_firmware.py'
      - 'firmware_release.py'
      - 'requirements-build.txt'
      - '.github/workflows/windows-exes.yml'
permissions:
  contents: read
jobs:
  display-firmware:
    # The dedicated Windows-only workflow verifies that reused firmware sources
    # are unchanged, then downloads the already successful firmware artifact.
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test actual LCD C and C++ output paths
        run: python -m unittest discover -s tests -p test_lcd_profiles.py -v
      - name: Build ILI9488 and ILI9341 OS and Doom firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/build_lcd_profiles.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lcd-build-diagnostics
          path: |
            OS/build-*/freslest_os_s3.map
            OS/build-*/compile_commands.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lcd-firmware-profiles
          path: |
            firmware/ili9488/*
            firmware/ili9341/*
          if-no-files-found: error
  build-and-launch:
    needs: display-firmware
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Prepare and verify firmware release 1.0
        run: python prepare_firmware.py
      - uses: actions/download-artifact@v4
        with:
          name: lcd-firmware-profiles
          path: firmware
      - name: Confirm original installer regression failures
        run: python tests/prove_regressions.py
      - name: Test corrected installer and preserved Viewer
        run: python tests/run_all.py
      - name: Build actual x64 Windows GUI executables
        run: python build_windows.py
      - name: Launch and close both packaged applications on Windows
        run: python tests/smoke_exes_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Freslest-1.0-Windows-EXEs
          path: dist/*
          if-no-files-found: error
          compression-level: 0
