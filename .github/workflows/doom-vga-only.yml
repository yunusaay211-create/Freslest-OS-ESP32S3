name: Doom VGA only
on:
  workflow_dispatch:
  push:
    paths:
      - 'Doom/**'
      - 'doom_updater/**'
      - '.github/workflows/doom-vga-only.yml'
permissions:
  contents: read
jobs:
  doom-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ensure OS and shared runtime are unchanged
        shell: bash
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin 7746435276511e3b6929072ccc8e080f922a523a
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code 7746435276511e3b6929072ccc8e080f922a523a HEAD -- OS shared_components common installer build_windows.py prepare_firmware.py firmware_release.py requirements-build.txt
      - name: Test Doom presentation and update write boundaries
        run: python -m unittest discover -s doom_updater -p 'test_*.py' -v
      - name: Build only Doom VGA
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python doom_updater/build_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: Doom-VGA-firmware-only
          path: doom_updater/payload/*
          if-no-files-found: error

