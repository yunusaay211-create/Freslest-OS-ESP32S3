name: Native OS and Doom updater
on:
  workflow_dispatch:
  push:
    paths:
      - 'common/usb_update/**'
      - 'Doom/tests/**'
      - 'tools/make_doom_update_zip.py'
      - 'tools/build_update_profiles.py'
      - 'tools/repack_update_installer.py'
      - '.github/workflows/native-doom-update.yml'
permissions:
  contents: read
  actions: read
jobs:
  update-profiles:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install host verification libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev libssl-dev
      - name: Preserve apps, LCD and VGA output, Doom and Windows sources
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin 8e81cef4c800f36edb4fa2e914ab84571638e8f3
          git fetch --no-tags --depth=1 origin 8d599ced5d172e76c5dc6c972498eea3182422d1
          git diff --exit-code 8e81cef4c800f36edb4fa2e914ab84571638e8f3 HEAD -- OS shared_components Doom/components Doom/main installer
      - name: Verify updater, display selection and protected installer contents
        shell: bash
        run: |
          python -m unittest discover -s doom_updater -p 'test_*.py' -v
          python Doom/tests/run_update_tests.py
          python Doom/tests/run_update_target_tests.py
          python Doom/tests/run_update_target_tests.py --lcd-model 9488
          python Doom/tests/run_native_doom_runtime_tests.py
          python Doom/tests/run_update_output_tests.py
          python Doom/tests/run_update_profile_tests.py
          python Doom/tests/run_update_installer_tests.py
          python Doom/tests/run_doom_bundle_tests.py
          python Doom/tests/run_native_installer_tests.py
          python Doom/tests/run_idf_rollback_tests.py
      - uses: actions/download-artifact@v4
        with:
          name: lcd-firmware-profiles
          path: native_update/reused/lcd
          run-id: 40664780601
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Freslest-Native-Doom-Update-VGA
          path: native_update/reused/vga
          run-id: 41300958453
          github-token: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: OS/build-update-shared
          key: esp32s3-idf544-updater-${{ hashFiles('OS/**', 'shared_components/**', 'common/usb_update/**') }}
          restore-keys: esp32s3-idf544-updater-
      - name: Build OS updater images only and reuse all Doom binaries
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/build_update_profiles.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: update-profile-build-diagnostics
          path: |
            OS/build-update-shared/freslest_os_s3.map
            OS/build-update-shared/compile_commands.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Freslest-OS-Doom-Updater-Profiles
          path: native_update/payload/**
          if-no-files-found: error
